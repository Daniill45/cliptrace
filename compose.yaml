name: cliptrace

x-test-environment: &test-environment
  APP_ENV: test
  DATABASE_URL: postgresql+asyncpg://cliptrace:cliptrace@test-db:5432/cliptrace_test
  TEST_DATABASE_URL: postgresql+asyncpg://cliptrace:cliptrace@test-db:5432/cliptrace_test
  UPLOAD_DIR: /app/data/uploads

services:
  db:
    image: docker.io/library/postgres:16.4-alpine
    environment:
      POSTGRES_DB: cliptrace
      POSTGRES_USER: cliptrace
      POSTGRES_PASSWORD: cliptrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliptrace -d cliptrace"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test-db:
    image: docker.io/library/postgres:16.4-alpine
    profiles: ["tools"]
    environment:
      POSTGRES_DB: cliptrace_test
      POSTGRES_USER: cliptrace
      POSTGRES_PASSWORD: cliptrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliptrace -d cliptrace_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - test_postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime
    env_file:
      - .env
    environment: &app-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://cliptrace:cliptrace@db:5432/cliptrace
      UPLOAD_DIR: /app/data/uploads
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Containerfile
      target: test
    environment: *test-environment
    depends_on:
      test-migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - test_uploads:/app/data/uploads
    profiles: ["tools"]

  test-migrate:
    build:
      context: .
      dockerfile: Containerfile
      target: runtime
    profiles: ["tools"]
    environment: *test-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      test-db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  test_postgres_data:
  uploads:
  test_uploads:
