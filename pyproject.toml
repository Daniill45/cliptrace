[project]
name = "cliptrace-backend"
version = "0.1.0"
description = "Production-like backend MVP for ClipTrace"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic==1.16.4",
    "anyio==4.10.0",
    "asyncpg==0.30.0",
    "fastapi==0.116.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "sqlalchemy[asyncio]==2.0.43",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.8",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
files = ["app"]
exclude = ["app/db/models"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
